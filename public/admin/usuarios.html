<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/logo.png"><title>Administradores | Delícias da Aninha</title><link rel="stylesheet" href="admin.css?v=4"><link rel="stylesheet" href="usuarios.css"></head>
<body><header class="admin-header"><div><strong>Delícias da Aninha</strong><span>Gerenciamento de administradores</span></div><nav class="user-nav"><a class="primary-btn" href="painel.html" data-permission="painel">Painel</a><a class="primary-btn" href="operacao.html" data-permission="operacao">🚀 Operação</a><a class="primary-btn" href="pedidos.html" data-permission="pedidos">Pedidos</a><button id="logoutUsers">Sair</button></nav></header>
<main class="users-wrap"><div class="users-heading"><div><h1>Administradores</h1><p>Cadastre usuários e escolha quais áreas poderão acessar.</p></div><button type="button" id="newUser" class="users-primary">+ Novo administrador</button></div><p id="feedback" role="status"></p><section id="usersList" class="users-list" aria-label="Administradores cadastrados">Carregando...</section>
<section class="users-form-card" id="editor" hidden><h2 id="editorTitle">Novo administrador</h2><form id="userForm"><input type="hidden" id="userId"><div class="users-fields"><label>Nome de usuário<input id="username" required minlength="3" maxlength="60" autocomplete="off"></label><label>Senha <small id="passwordHint">(mínimo 8 caracteres)</small><input id="password" type="password" minlength="8" autocomplete="new-password"></label></div><p class="users-subtitle">Permissões de acesso</p><div class="permission-grid"><label><input type="checkbox" id="permLoja"> Ver loja</label><label><input type="checkbox" id="permPainel"> Painel / Produtos</label><label><input type="checkbox" id="permOperacao"> Operação</label><label><input type="checkbox" id="permPedidos"> Pedidos</label><label><input type="checkbox" id="permAdmin"> Gerenciar administradores</label></div><label class="active-check"><input id="isActive" type="checkbox" checked> Conta ativa</label><div class="users-actions"><button type="submit" class="users-primary" id="saveUser">Salvar</button><button type="button" id="cancelEdit">Cancelar</button></div></form></section></main><script src="permissoes.js?v=4"></script><script src="usuarios.js"></script></body></html>
